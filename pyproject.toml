[project]
name = "comfyui-dynamic-prompt-node"
version = "2.0.0"
description = "ComfyUI V3 custom node that resolves dynamic prompts to text on the server, reproducibly from a seed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["comfyui", "prompt", "dynamic-prompts", "wildcards", "text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
authors = [
    { name = "Mistralys" },
]

[project.urls]
Repository = "https://github.com/Mistralys/comfyui-dynamic-prompt-node"
Issues = "https://github.com/Mistralys/comfyui-dynamic-prompt-node/issues"

[tool.comfy]
PublisherId = "Mistralys"
DisplayName = "Dynamic Prompt Text"
